<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artés agency - Дизайн который продает</title>
    <!-- Подключение иконок FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Общие настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #02050a; /* Темно-синий фон */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Шапка и навигация */
        header {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #3b82f6;
        }

        /* Основной контент */
        main {
            text-align: center;
            max-width: 800px;
            width: 100%;
            padding: 0 20px;
            flex-grow: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #bbbbbb;
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 80px;
            transition: background-color 0.3s;
            box-shadow: 0 4px 15px rgba(26, 115, 232, 0.4);
        }

        .cta-button:hover {
            background-color: #1666c9;
        }

        /* Белая панель со статистикой */
        .stats-card {
            background-color: #ffffff;
            color: #333;
            border-radius: 20px;
            padding: 40px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 700px;
            margin: 0 auto 100px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .stat-item:not(:last-child) {
            border-right: 1px solid #e0e0e0;
        }

        .stat-icon {
            color: #1a73e8;
            font-size: 1.5rem;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #000;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #777;
        }

        /* Блок "Почему ты должен..." */
        .why-section h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            line-height: 1.3;
        }

        .features-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 450px;
            margin: 0 auto;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .check-icon {
            background-color: #1a73e8;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .feature-text {
            font-size: 1.1rem;
            color: #eeeeee;
        }

        /* Футер с соцсетями */
        footer {
            margin-top: auto;
            padding: 50px 0;
        }

        .social-icons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .social-icon {
            background-color: #1a73e8;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 1.5rem;
            transition: transform 0.2s;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        /* АДАПТАЦИЯ ПОД ТЕЛЕФОН (Мобильная версия) */
        @media (max-width: 768px) {
            nav {
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 14px;
            }

            h1 {
                font-size: 2.5rem;
                margin-top: 20px;
            }

            .subtitle {
                font-size: 1rem;
                padding: 0 10px;
            }

            .cta-button {
                padding: 15px 30px;
                font-size: 1rem;
                margin-bottom: 50px;
            }

            /* Превращаем статистику в колонку на телефоне */
            .stats-card {
                flex-direction: column;
                gap: 30px;
                padding: 30px;
                margin-bottom: 60px;
            }

            .stat-item:not(:last-child) {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                padding-bottom: 20px;
                width: 100%;
            }

            .why-section h2 {
                font-size: 1.6rem;
                padding: 0 10px;
            }

            .feature-item {
                align-items: flex-start;
            }

            .feature-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#">Связаться</a>
            <a href="#">Прайс</a>
            <a href="#">Портфолио</a>
            <a href="#">Отзывы</a>
        </nav>
    </header>

    <main>
        <h1>Дизайн который<br>продает</h1>
        <p class="subtitle">Artés agency – это не про красивую обертку<br>это про бизнес и продажи</p>
        
        <button class="cta-button">Заказать дизайн</button>

        <div class="stats-card">
            <div class="stat-item">
                <i class="fas fa-user-tie stat-icon"></i>
                <div class="stat-number">30+</div>
                <div class="stat-label">Заказов</div>
            </div>
            <div class="stat-item">
                <i class="fas fa-thumbs-up stat-icon"></i>
                <div class="stat-number">15+</div>
                <div class="stat-label">Отзывов</div>
            </div>
            <div class="stat-item">
                <i class="fas fa-font stat-icon"></i>
                <div class="stat-number">5+</div>
                <div class="stat-label">логотипов</div>
            </div>
        </div>

        <div class="why-section">
            <h2>Почему ты должен заказать<br>дизайн именно у нас</h2>
            <div class="features-list">
                <div class="feature-item">
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                    <div class="feature-text">Выполнение работы до 72 часов</div>
                </div>
                <div class="feature-item">
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                    <div class="feature-text">Более 15 положительных отзывов</div>
                </div>
                <div class="feature-item">
                    <div class="check-icon"><i class="fas fa-check"></i></div>
                    <div class="feature-text">2 года на рынке дизайна</div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="social-icons">
            <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-telegram-plane"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
        </div>
    </footer>

</body>
</html>
