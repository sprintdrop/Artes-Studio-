<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Artes Studio — Liquid Glassmorphism</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ЧАСТЬ 1: RESET, БАЗА, ДИНАМИЧЕСКИЙ ЖИДКИЙ ФОН
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            min-height: 100dvh;
            color: #f0f0f5;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background: linear-gradient(145deg, #0a0a0f 0%, #1a0f2e 30%, #0f0a20 60%, #0a0a0f 100%);
            background-attachment: fixed;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* ===== ДИНАМИЧЕСКИЙ ЖИДКИЙ ФОН ===== */
        #app::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(108, 92, 231, 0.20) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 180, 216, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(108, 92, 231, 0.08) 0%, transparent 60%);
            animation: liquidFlow 25s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes liquidFlow {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            33% { transform: translate(3%, 4%) scale(1.08) rotate(1.5deg); }
            66% { transform: translate(-4%, 2%) scale(1.12) rotate(-1.2deg); }
            100% { transform: translate(2%, -3%) scale(1.04) rotate(0.8deg); }
        }
        #app::after {
            content: '';
            position: fixed;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(ellipse at 40% 60%, rgba(108, 92, 231, 0.06) 0%, transparent 50%);
            animation: liquidFlow2 35s ease-in-out infinite alternate-reverse;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes liquidFlow2 {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-5%, 3%) scale(1.1); }
            100% { transform: translate(5%, -2%) scale(0.95); }
        }
/* ============================================================
   ЧАСТЬ 2: SPLASH SCREEN, ШАПКА, СТЕКЛЯННЫЕ КАРТОЧКИ
   ============================================================ */
.splash-screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
    transition: opacity 0.8s ease, transform 0.8s ease;
    pointer-events: none;
}
.splash-screen.hide {
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
}
.splash-content {
    text-align: center;
    animation: pulseGlow 1.8s ease-in-out forwards;
}
.splash-logo {
    font-size: 72px;
    color: #6c5ce7;
    text-shadow: 0 0 60px rgba(108, 92, 231, 0.5), 0 0 120px rgba(108, 92, 231, 0.2);
    margin-bottom: 12px;
    font-weight: 300;
    letter-spacing: 8px;
}
.splash-title {
    font-size: clamp(32px, 9vw, 44px);
    font-weight: 700;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #f0f0f5 30%, #6c5ce7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.splash-subtitle {
    font-size: clamp(14px, 3.5vw, 18px);
    color: #9895b0;
    letter-spacing: 4px;
    margin-top: 6px;
    font-weight: 400;
}
@keyframes pulseGlow {
    0% { opacity: 0; transform: scale(0.96); }
    40% { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
}

.app-header {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 12px;
    background: rgba(10, 10, 15, 0.50);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.header-logo {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 3px;
    color: #f0f0f5;
    display: flex;
    align-items: center;
    gap: 8px;
}
.header-logo .logo-symbol {
    color: #6c5ce7;
    font-size: 28px;
}
.theme-toggle {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f0f0f5;
    cursor: pointer;
    transition: 0.3s;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
.theme-toggle:active { transform: scale(0.92); }
.theme-toggle svg { width: 22px; height: 22px; stroke: #f0f0f5; }

.glass-card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 40px rgba(108, 92, 231, 0.05);
/* ============================================================
   ЧАСТЬ 3: КОНТЕЙНЕР ВКЛАДОК + ПОРТФОЛИО
   ============================================================ */
.tab-container {
    flex: 1;
    padding: 8px 16px 80px;
    position: relative;
    z-index: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.tab-content {
    display: none;
    animation: fadeContent 0.4s ease forwards;
}
.tab-content.active {
    display: block;
}
@keyframes fadeContent {
    0% { opacity: 0; transform: translateY(12px); }
    100% { opacity: 1; transform: translateY(0); }
}
.tab-title {
    font-size: clamp(24px, 6.5vw, 32px);
    font-weight: 700;
    margin: 4px 0 20px;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f0f0f5 40%, #9895b0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.portfolio-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}
.portfolio-item {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
}
.portfolio-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
}
.portfolio-item:active { transform: scale(0.96); }
.portfolio-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(135deg, #1a0f2e, #0f0a20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    color: #6c5ce7;
    overflow: hidden;
    position: relative;
}
.portfolio-image .icon-symbol {
    font-size: 56px;
    color: #6c5ce7;
    text-shadow: 0 0 40px rgba(108, 92, 231, 0.3);
}
.portfolio-info {
    padding: 10px 12px 12px;
}
.portfolio-info h4 {
    font-size: 14px;
    font-weight: 600;
    color: #f0f0f5;
    margin-bottom: 2px;
    line-height: 1.2;
}
.portfolio-info p {
    font-size: 12px;
    color: #9895b0;
    font-weight: 400;
}
.portfolio-info .category-tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    background: rgba(108, 92, 231, 0.15);
    color: #6c5ce7;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.5px;
    margin-top: 4px;
}
/* ============================================================
   ЧАСТЬ 4: УСЛУГИ
   ============================================================ */
.services-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.service-card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
}
.service-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
}
.service-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 6px;
}
.service-icon {
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(108, 92, 231, 0.12);
    border-radius: 14px;
    border: 1px solid rgba(108, 92, 231, 0.15);
    font-size: 28px;
    color: #6c5ce7;
    flex-shrink: 0;
}
.service-icon .icon-symbol {
    font-size: 30px;
    color: #6c5ce7;
}
.service-title {
    font-size: 18px;
    font-weight: 700;
    color: #f0f0f5;
}
.service-meta {
    display: flex;
    gap: 20px;
    font-size: 13px;
    color: #9895b0;
    margin: 4px 0 6px;
}
.service-meta .price {
    color: #6c5ce7;
    font-weight: 700;
    font-size: 15px;
}
.service-desc {
    font-size: 14px;
    color: #c8c5d8;
    margin-bottom: 12px;
    line-height: 1.4;
}
.btn-order {
    background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    width: 100%;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
    letter-spacing: 0.5px;
}
.btn-order:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
}
.btn-order:active { transform: scale(0.96); }
/* ============================================================
   ЧАСТЬ 5: ОТЗЫВЫ — КАРУСЕЛЬ
   ============================================================ */
.reviews-carousel {
    overflow: hidden;
    position: relative;
    touch-action: pan-y;
    border-radius: 16px;
}
.reviews-track {
    display: flex;
    transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    will-change: transform;
}
.review-slide {
    min-width: 100%;
    padding: 4px;
}
.review-card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    min-height: 180px;
}
.review-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
}
.review-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #00b4d8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 22px;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
}
.review-name {
    font-weight: 600;
    font-size: 16px;
    color: #f0f0f5;
}
.review-role {
    font-size: 13px;
    color: #9895b0;
}
.review-stars {
    color: #fbbf24;
    font-size: 18px;
    letter-spacing: 3px;
    margin: 4px 0 8px;
}
.review-text {
    font-size: 14px;
    line-height: 1.6;
    color: #d0cde0;
}
.dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
}
.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
    padding: 0;
}
.dot.active {
    background: #6c5ce7;
    width: 28px;
    border-radius: 4px;
    box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
}
/* ============================================================
   ЧАСТЬ 6: КОНТАКТЫ И ФОРМА
   ============================================================ */
.contact-block {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: transform 0.3s ease;
}
.contact-row:hover { transform: translateY(-2px); }
.contact-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(108, 92, 231, 0.10);
    border-radius: 12px;
    font-size: 22px;
    color: #6c5ce7;
    flex-shrink: 0;
    border: 1px solid rgba(108, 92, 231, 0.10);
}
.contact-icon .icon-symbol {
    font-size: 24px;
    color: #6c5ce7;
}
.contact-info {
    flex: 1;
    font-size: 15px;
    color: #f0f0f5;
    font-weight: 500;
}
.contact-info small {
    display: block;
    font-weight: 400;
    font-size: 12px;
    color: #9895b0;
    margin-top: 1px;
}
.btn-copy {
    background: rgba(108, 92, 231, 0.15);
    border: 1px solid rgba(108, 92, 231, 0.15);
    border-radius: 8px;
    padding: 6px 16px;
    color: #f0f0f5;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
}
.btn-copy:hover { background: rgba(108, 92, 231, 0.25); }
.btn-copy:active { transform: scale(0.92); }

.contact-form {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
.contact-form h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 14px;
    color: #f0f0f5;
    letter-spacing: -0.3px;
}
.contact-form label {
    font-size: 13px;
    font-weight: 500;
    color: #9895b0;
    display: block;
    margin-bottom: 4px;
}
.contact-form input,
.contact-form select,
.contact-form textarea {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: #f0f0f5;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
    margin-bottom: 14px;
    outline: none;
}
.contact-form input:focus,
.contact-form select:focus,
.contact-form textarea:focus {
    border-color: #6c5ce7;
    background: rgba(108, 92, 231, 0.08);
    box-shadow: 0 0 30px rgba(108, 92, 231, 0.05);
}
.contact-form input::placeholder,
.contact-form textarea::placeholder { color: #6c6890; }
.contact-form textarea {
    resize: vertical;
    min-height: 80px;
}
.contact-form select option {
    background: #1a0f2e;
    color: #f0f0f5;
}
.btn-submit {
    background: linear-gradient(135deg, #6c5ce7, #5a4bd1);
    border: none;
    border-radius: 12px;
    padding: 14px;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    width: 100%;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
    letter-spacing: 0.5px;
    font-family: 'Inter', sans-serif;
}
.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
}
.btn-submit:active { transform: scale(0.96); }
    padding: 16px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
}
.glass-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 60px rgba(108, 92, 231, 0.08);
}
.glass-card:active { transform: scale(0.97); }
        /* ============================================================
           ЧАСТЬ 7: НИЖНЯЯ НАВИГАЦИЯ, МОДАЛКА, ТОСТ, СВЕТЛАЯ ТЕМА
           ============================================================ */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 0 env(safe-area-inset-bottom, 8px);
            background: rgba(10, 10, 15, 0.80);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 100;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #6c6890;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
            min-width: 44px;
            font-family: 'Inter', sans-serif;
            position: relative;
        }
        .tab-btn .tab-icon { font-size: 24px; line-height: 1; transition: transform 0.3s ease; }
        .tab-btn .tab-label { font-size: 10px; letter-spacing: 0.3px; transition: color 0.3s ease; }
        .tab-btn.active { color: #6c5ce7; }
        .tab-btn.active .tab-icon { transform: translateY(-2px); }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: linear-gradient(90deg, #6c5ce7, #00b4d8);
            border-radius: 0 0 4px 4px;
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.3);
        }
        .tab-btn:hover .tab-icon { transform: scale(1.1); }
        .tab-btn:active { transform: scale(0.92); }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-content {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            max-width: 400px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 30px;
            background: none;
            border: none;
            color: #9895b0;
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
            transition: color 0.3s ease;
        }
        .modal-close:hover { color: #f0f0f5; }
        .modal-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: linear-gradient(135deg, #1a0f2e, #0f0a20);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            color: #6c5ce7;
            margin-bottom: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .modal-image .icon-symbol { font-size: 72px; color: #6c5ce7; }
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #f0f0f5;

        /* ===== СВЕТЛАЯ ТЕМА ===== */

    </style>
</head>
<body>
    <div id="app">
        <!-- ===== SPLASH SCREEN ===== -->

        <!-- ===== TAB CONTAINER ===== -->
        <main class="tab-container" id="tabContainer">
<!-- ===== PORTFOLIO ===== -->
<section id="tab-portfolio" class="tab-content active">

    <!-- ===== CONTACT ===== -->

</main>
    <!-- ===== TAB BAR (НИЖНЯЯ НАВИГАЦИЯ) ===== -->
    <nav class="tab-bar">
        <button class="tab-btn active" data-tab="tab-portfolio">
            <span class="tab-icon">◈</span>
            <span class="tab-label">Портфолио</span>
        </button>
        <button class="tab-btn" data-tab="tab-services">
            <span class="tab-icon">▤</span>
            <span class="tab-label">Услуги</span>
        </button>
        <button class="tab-btn" data-tab="tab-reviews">
            <span class="tab-icon">★</span>
            <span class="tab-label">Отзывы</span>
        </button>
        <button class="tab-btn" data-tab="tab-contact">
            <span class="tab-icon">✉</span>
            <span class="tab-label">Контакты</span>
        </button>
    </nav>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-image" id="modalImage">
                <span class="icon-symbol">◈</span>
            </div>
            <h3 class="modal-title" id="modalTitle">Название</h3>
            <p class="modal-category" id="modalCategory">Категория</p>
            <p class="modal-desc" id="modalDesc">Описание</p>
            <p class="modal-timeline" id="modalTimeline"><strong>Срок:</strong> 2 недели</p>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">Сообщение отправлено</div>
</div>
<script>
    (function() {
        'use strict';

        // ===== DATA С СИМВОЛАМИ ВМЕСТО СМАЙЛИКОВ =====
        const data = {
            works: [
                { id: 1, title: 'Брендинг TechStart', category: 'Логотип', symbol: '◈', description: 'Полный брендинг для технологического стартапа', timeline: '2 недели' },
                { id: 2, title: 'Рекламный баннер', category: 'Баннер', symbol: '▤', description: 'Баннер для социальных сетей', timeline: '2 дня' },
                { id: 3, title: 'Аватарка блогера', category: 'Аватарка', symbol: '◉', description: 'Стильный аватар для YouTube-блогера', timeline: '1 день' },
                { id: 4, title: 'Айдентика кофейни', category: 'Логотип', symbol: '◈', description: 'Логотип и стиль для кофейни', timeline: '1.5 недели' },
                { id: 5, title: 'Баннер для магазина', category: 'Баннер', symbol: '▤', description: 'Рекламный баннер для интернет-магазина', timeline: '2 дня' },
                { id: 6, title: 'Аватарка студии', category: 'Аватарка', symbol: '◉', description: 'Корпоративная аватарка для соцсетей', timeline: '1 день' }
            ],
            services: [
                { id: 'banners', title: 'Баннеры', symbol: '▤', price: 'от 5 000 ₽', timeline: '2-3 дня', description: 'Разработка баннеров для соцсетей и рекламы. Адаптация под все форматы.' },
                { id: 'logos', title: 'Логотипы', symbol: '◈', price: 'от 15 000 ₽', timeline: '5-7 дней', description: 'Создание уникального фирменного стиля и логотипа для вашего бизнеса.' },
                { id: 'avatars', title: 'Аватарки', symbol: '◉', price: 'от 3 000 ₽', timeline: '1-2 дня', description: 'Дизайн аватарок для соцсетей, YouTube и мессенджеров.' }
            ],
            reviews: [
                { name: 'Екатерина', role: 'Владелец бренда', text: 'Отличная работа! Логотип превзошел все ожидания. Быстро и профессионально.', stars: 5 },
                { name: 'Михаил', role: 'YouTube-блогер', text: 'Сделали аватарку и баннеры для канала. Теперь канал выглядит дорого и стильно.', stars: 5 },
                { name: 'Анна', role: 'Основатель стартапа', text: 'Полный брендинг под ключ. Всё четко, в срок и с душой. Рекомендую!', stars: 5 }
            ]
        };

        // ===== DOM REFS =====
        const splash = document.getElementById('splash');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const portfolioGrid = document.getElementById('portfolioGrid');
        const servicesList = document.getElementById('servicesList');
        const reviewsTrack = document.getElementById('reviewsTrack');
        const dotsContainer = document.getElementById('dotsContainer');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');
        const modalImage = document.getElementById('modalImage');
        const modalTitle = document.getElementById('modalTitle');
        const modalCategory = document.getElementById('modalCategory');
        const modalDesc = document.getElementById('modalDesc');
        const modalTimeline = document.getElementById('modalTimeline');
        const toast = document.getElementById('toast');
        const themeToggle = document.getElementById('themeToggle');
        const contactForm = document.getElementById('contactForm');

        let currentReviewIndex = 0;
        let touchStartX = 0;
        let touchEndX = 0;

        // ===== RENDER PORTFOLIO =====
        function renderPortfolio() {
            portfolioGrid.innerHTML = data.works.map(w => `
                <div class="portfolio-item" data-id="${w.id}">
                    <div class="portfolio-image">
                        <span class="icon-symbol">${w.symbol}</span>
                    </div>
                    <div class="portfolio-info">
                        <h4>${w.title}</h4>
                        <p>${w.category}</p>
                        <span class="category-tag">${w.category}</span>
                    </div>
                </div>
            `).join('');
        }

        // ===== RENDER SERVICES =====
        function renderServices() {
            servicesList.innerHTML = data.services.map(s => `
                <div class="service-card">
                    <div class="service-header">
                        <div class="service-icon">
                            <span class="icon-symbol">${s.symbol}</span>
                        </div>
                        <div class="service-title">${s.title}</div>
                    </div>
                    <div class="service-meta">
                        <span class="price">${s.price}</span>
                        <span>⏱ ${s.timeline}</span>
                    </div>
                    <p class="service-desc">${s.description}</p>
                    <button class="btn-order" data-service="${s.id}">Заказать</button>
                </div>
            `).join('');

            document.querySelectorAll('.btn-order').forEach(btn => {
                btn.addEventListener('click', function() {
                    switchTab('tab-contact');
                    showToast('Переход в раздел контактов');
                });
            });
        }
// ===== RENDER REVIEWS =====
function renderReviews() {
    reviewsTrack.innerHTML = data.reviews.map((r, i) => {
        const stars = '★'.repeat(r.stars) + '☆'.repeat(5 - r.stars);
        const initial = r.name.charAt(0);
        return `
            <div class="review-slide">
                <div class="review-card">
                    <div class="review-header">
                        <div class="review-avatar">${initial}</div>
                        <div>
                            <div class="review-name">${r.name}</div>
                            <div class="review-role">${r.role}</div>
                        </div>
                    </div>
                    <div class="review-stars">${stars}</div>
                    <p class="review-text">${r.text}</p>
                </div>
            </div>
        `;
    }).join('');

    // Dots
    dotsContainer.innerHTML = data.reviews.map((_, i) => `
        <button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>
    `).join('');

    dotsContainer.querySelectorAll('.dot').forEach(dot => {
        dot.addEventListener('click', function() {
            goToReview(parseInt(this.dataset.index));
        });
    });

    updateReviewPosition();
}

// ===== CAROUSEL CONTROLS =====
function goToReview(index) {
    const total = data.reviews.length;
    if (index < 0) index = total - 1;
    if (index >= total) index = 0;
    currentReviewIndex = index;
    updateReviewPosition();
    dotsContainer.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
    });
}

function updateReviewPosition() {
    reviewsTrack.style.transform = `translateX(-${currentReviewIndex * 100}%)`;
}

// Touch events
const carousel = document.getElementById('reviewsCarousel');
carousel.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

carousel.addEventListener('touchend', function(e) {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchStartX - touchEndX;
    if (Math.abs(diff) > 40) {
        if (diff > 0) goToReview(currentReviewIndex + 1);
        else goToReview(currentReviewIndex - 1);
    }
}, { passive: true });

// Window resize
let resizeTimer;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateReviewPosition, 200);
});
            // ===== MODAL =====
            function openModal(work) {
                modalImage.innerHTML = `<span class="icon-symbol">${work.symbol}</span>`;
                modalTitle.textContent = work.title;
                modalCategory.textContent = work.category;
                modalDesc.textContent = work.description;
                modalTimeline.innerHTML = `<strong>Срок:</strong> ${work.timeline}`;
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
            }

            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // ===== TAB SWITCHING =====
            function switchTab(tabId) {
                tabBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tab === tabId);
                });
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.classList.remove('active');
                });
                const target = document.getElementById(tabId);
                if (target) target.classList.add('active');
            }

            tabBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    switchTab(this.dataset.tab);
                });
            });

            // ===== PORTFOLIO CLICK =====
            portfolioGrid.addEventListener('click', function(e) {
                const item = e.target.closest('.portfolio-item');
                if (item) {
                    const id = parseInt(item.dataset.id);
                    const work = data.works.find(w => w.id === id);
                    if (work) openModal(work);
                }
            });

            // ===== THEME TOGGLE =====
            let isLight = false;
            themeToggle.addEventListener('click', function() {
                isLight = !isLight;
                document.body.classList.toggle('light', isLight);
            });

            // ===== COPY PHONE =====
            document.querySelectorAll('.btn-copy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const text = this.dataset.copy;
                    if (navigator.clipboard) {
                        navigator.clipboard.writeText(text).then(() => {
                            showToast('Номер скопирован!');
                        });
                    } else {
                        const input = document.createElement('input');
                        input.value = text;
                        document.body.appendChild(input);
                        input.select();
                        document.execCommand('copy');
                        input.remove();
                        showToast('Номер скопирован!');
                    }
                });
            });

            // ===== FORM SUBMIT =====
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const formData = new FormData(this);
                const data = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    service: formData.get('service'),
                    message: formData.get('message')
                };
                console.log('Заявка отправлена:', data);
                showToast('Заявка отправлена! Мы свяжемся с вами.');
                this.reset();
            });

            // ===== TOAST =====
            let toastTimeout;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== SPLASH =====
            setTimeout(() => {
                splash.classList.add('hide');
                setTimeout(() => { splash.style.display = 'none'; }, 800);
            }, 1800);

            // ===== INIT =====
            renderPortfolio();
            renderServices();
            renderReviews();

            // Fix for iOS Safari 100vh
            function setVH() {
                let vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', vh + 'px');
            }
            setVH();
            window.addEventListener('resize', setVH);

        })();
    </script>
</body>
